services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: necessify
      POSTGRES_PASSWORD: necessify
      POSTGRES_DB: necessify
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U necessify -d necessify"]
      interval: 5s
      timeout: 5s
      retries: 10

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    environment:
      PORT: 3000
      DATABASE_URL: postgres://necessify:necessify@postgres:5432/necessify
      MONGO_URL: mongodb://mongo:27017/necessify
      OCR_CACHE_PATH: /tmp
      SESSION_SECRET: ${SESSION_SECRET:-}
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy

volumes:
  postgres-data:
  mongo-data:
